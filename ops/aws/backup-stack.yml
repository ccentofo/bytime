  # feature-plan-cloud-export.md §6.2, §6.6: the download page's role on cadenzpoint.com, trusted by the Vercel OIDC provider
  # (bootstrap.yml) for the production environment of one project only (exact StringEquals on aud and sub; no stored key).
  # It reads delivery/ only, through 5-minute presigned URLs. The team slug and project name are the template constants
  # (equal here, in bootstrap.yml and in expected-policies.ts; U6). Until the founder gives them they are fail-closed
  # placeholders (P1): no Vercel token can satisfy this trust.
  ExportDownloadRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cadenzpoint-backup-export-download
      Path: /cadenzpoint-backup/
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: TrustVercelProduction
            Effect: Allow
            Principal:
              Federated:
                Fn::Sub: arn:aws:iam::${AWS::AccountId}:oidc-provider/oidc.vercel.com/vercel-team-slug-pending
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'oidc.vercel.com/vercel-team-slug-pending:aud': 'https://vercel.com/vercel-team-slug-pending'
                'oidc.vercel.com/vercel-team-slug-pending:sub': 'owner:vercel-team-slug-pending:project:vercel-project-pending:environment:production'
      Policies:
        - PolicyName: cadenzpoint-backup-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadDeliveries
                Effect: Allow
                Action: s3:GetObject
                Resource:
                  Fn::Sub: arn:aws:s3:::cadenzpoint-exports-${AWS::AccountId}/delivery/*
              - Sid: DecryptDeliveries
                Effect: Allow
                Action: kms:Decrypt
                Resource:
                  Fn::GetAtt: [ExportKey, Arn]
                Condition:
                  StringEquals:
                    kms:ViaService: s3.us-east-1.amazonaws.com
                    kms:EncryptionContext:aws:s3:arn:
                      Fn::Sub: arn:aws:s3:::cadenzpoint-exports-${AWS::AccountId}

  # feature-plan-disaster-restore.md §6.2: the button's role, reachable only from a job in the founder-approved
  # `aws-disaster` environment (GitHub OIDC). It may start only the disaster family and (feature-plan-cloud-export.md §6.2)
  # the export family, in this cluster; a role allowed to run a family may run it with any command or environment (no IAM
  # condition restricts overrides), and Describe/Stop also reach the backup tasks in this cluster. PassRole only to
  # ecs-tasks, for both families' task and execution roles: with PassRole on both, a taskRoleArn override could swap one
  # family's role for the other's. That is accepted: every press needs the founder's approval.
  DisasterButtonRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cadenzpoint-backup-disaster-button
      Path: /cadenzpoint-backup/
      MaxSessionDuration: 21600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: TrustGitHubDisasterEnvironment
            Effect: Allow
            Principal:
              Federated:
                Fn::Sub: arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: repo:ccentofo/bytime:environment:aws-disaster
      Policies:
        - PolicyName: cadenzpoint-backup-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: RunDisasterTask
                Effect: Allow
                Action: ecs:RunTask
                Resource:
                  - Fn::Sub: arn:aws:ecs:us-east-1:${AWS::AccountId}:task-definition/cadenzpoint-backup-disaster:*
                  - Fn::Sub: arn:aws:ecs:us-east-1:${AWS::AccountId}:task-definition/cadenzpoint-backup-export:*
                Condition:
                  ArnEquals:
                    ecs:cluster:
                      Fn::Sub: arn:aws:ecs:us-east-1:${AWS::AccountId}:cluster/cadenzpoint-backup
              - Sid: ListTasks
                Effect: Allow
                Action: ecs:ListTasks
                Resource: '*'
                Condition:
                  ArnEquals:
                    ecs:cluster:
                      Fn::Sub: arn:aws:ecs:us-east-1:${AWS::AccountId}:cluster/cadenzpoint-backup
              - Sid: DescribeAndStopTasks
                Effect: Allow
                Action:
                  - ecs:DescribeTasks
                  - ecs:StopTask
                Resource:
                  Fn::Sub: arn:aws:ecs:us-east-1:${AWS::AccountId}:task/cadenzpoint-backup/*
              - Sid: PassDisasterRoles
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/cadenzpoint-backup/cadenzpoint-backup-disaster-task
                  - Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/cadenzpoint-backup/cadenzpoint-backup-disaster-exec
                  - Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/cadenzpoint-backup/cadenzpoint-backup-export-task
                  - Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/cadenzpoint-backup/cadenzpoint-backup-export-exec
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com
              - Sid: TagTasks
                Effect: Allow
                Action: ecs:TagResource
                Resource: '*'
                Condition:
                  StringEquals:
                    ecs:CreateAction: RunTask
              - Sid: ReadStackOutputs
                Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource:
                  Fn::Sub: arn:aws:cloudformation:us-east-1:${AWS::AccountId}:stack/cadenzpoint-backup/*

