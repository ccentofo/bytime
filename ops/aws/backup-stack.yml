      - AuditLogGroup
      - RestoreTestLogGroup
      - BackupTaskRole
      - RestoreTestTaskRole
      - AuditTaskRole
      - BackupExecRole
      - AuditExecRole
      - RestoreTestExecRole
      - RestoreTestTaskDefinition
      - AuditTaskDefinition
      - AlertTopic
      - AlertSubscription
      - AlertTopicPolicy
      - ProtectionsRule
      - RolesRule
      - DlqAlarm
      - MonthlyBudget
    Properties:
      Name: cadenzpoint-backup-catchup
      ScheduleExpression: 'cron(17 18 * * ? *)'
      ScheduleExpressionTimezone: UTC
      FlexibleTimeWindow:
        Mode: 'OFF'
      State: ENABLED
      Target:
        Arn:
          Fn::GetAtt: [Cluster, Arn]
        RoleArn:
          Fn::GetAtt: [SchedulerRole, Arn]
        Input: '{"containerOverrides":[{"name":"backup","command":["backup", "--if-missing-today"]}]}'
