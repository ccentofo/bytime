  # ---- task definitions (one image, a different command each) -------------------------------------------------------
  BackupTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: cadenzpoint-backup-backup
      Cpu: '2048'
      Memory: '4096'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: X86_64
      ExecutionRoleArn:
        Fn::GetAtt: [BackupExecRole, Arn]
      TaskRoleArn:
        Fn::GetAtt: [BackupTaskRole, Arn]
      ContainerDefinitions:
        - Name: backup
          Image:
            Ref: ImageUri
          Essential: true
          Command:
            - backup
          StopTimeout: 120
          LinuxParameters:
            InitProcessEnabled: true
          Environment:
            - Name: AWS_REGION
              Value: us-east-1
            - Name: BACKUP_BUCKET
              Value:
                Ref: BackupBucket
            - Name: BACKUP_KMS_KEY_ARN
              Value:
                Fn::GetAtt: [BackupKey, Arn]
            - Name: BACKUP_PG_DUMP_BIN
              Value: /usr/lib/postgresql/16/bin/pg_dump
            - Name: BACKUP_CONCURRENCY
              Value: '3'
            - Name: BACKUP_TARGET_DEADLINE_MINUTES
              Value: '30'
          Secrets:
            - Name: CONTROL_PLANE_DATABASE_URL
              ValueFrom:
                Fn::Sub: arn:aws:ssm:us-east-1:${AWS::AccountId}:parameter/cadenzpoint/backup/control-plane-url
            - Name: ENCRYPTION_KEY
              ValueFrom:
                Fn::Sub: arn:aws:ssm:us-east-1:${AWS::AccountId}:parameter/cadenzpoint/backup/encryption-key
            - Name: BACKUP_CONTROL_PLANE_ID
              ValueFrom:
                Fn::Sub: arn:aws:ssm:us-east-1:${AWS::AccountId}:parameter/cadenzpoint/backup/control-plane-backup-id
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Ref: BackupLogGroup
              awslogs-region: us-east-1
              awslogs-stream-prefix: backup

  RestoreTestTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: cadenzpoint-backup-restore-test
      Cpu: '2048'
      Memory: '4096'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: X86_64
      ExecutionRoleArn:
        Fn::GetAtt: [RestoreTestExecRole, Arn]
      TaskRoleArn:
        Fn::GetAtt: [RestoreTestTaskRole, Arn]
      ContainerDefinitions:
        - Name: restore-test
          Image:
            Ref: ImageUri
          Essential: true
          Command:
            - restore-test
          StopTimeout: 120
          LinuxParameters:
            InitProcessEnabled: true
          Environment:
            - Name: AWS_REGION
              Value: us-east-1
            - Name: BACKUP_BUCKET
              Value:
                Ref: BackupBucket
            - Name: BACKUP_KMS_KEY_ARN
              Value:
                Fn::GetAtt: [BackupKey, Arn]
            - Name: BACKUP_DECRYPT_KEY_ARNS
              Value:
                Fn::GetAtt: [BackupKey, Arn]
            - Name: BACKUP_PG_RESTORE_BIN
              Value: /usr/lib/postgresql/16/bin/pg_restore
            - Name: RESTORE_TEST_CONCURRENCY
              Value: '2'
            - Name: RESTORE_TEST_DEADLINE_HOURS
              Value: '6'
            - Name: RESTORE_TEST_TARGET_DEADLINE_MINUTES
              Value: '120'
          Secrets:
            - Name: CONTROL_PLANE_DATABASE_URL
              ValueFrom:
                Fn::Sub: arn:aws:ssm:us-east-1:${AWS::AccountId}:parameter/cadenzpoint/backup/control-plane-url
            - Name: RESTORE_TEST_DATABASE_URL
              ValueFrom:
                Fn::Sub: arn:aws:ssm:us-east-1:${AWS::AccountId}:parameter/cadenzpoint/backup/restore-test-url
            - Name: BACKUP_CONTROL_PLANE_ID
              ValueFrom:
                Fn::Sub: arn:aws:ssm:us-east-1:${AWS::AccountId}:parameter/cadenzpoint/backup/control-plane-backup-id
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Ref: RestoreTestLogGroup
              awslogs-region: us-east-1
              awslogs-stream-prefix: restore-test

  AuditTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: cadenzpoint-backup-audit
      Cpu: '512'
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: X86_64
      ExecutionRoleArn:
        Fn::GetAtt: [AuditExecRole, Arn]
      TaskRoleArn:
        Fn::GetAtt: [AuditTaskRole, Arn]
      ContainerDefinitions:
        - Name: audit
          Image:
            Ref: ImageUri
          Essential: true
          Command:
            - audit
          StopTimeout: 120
          LinuxParameters:
            InitProcessEnabled: true
          Environment:
            - Name: AWS_REGION
              Value: us-east-1
            - Name: BACKUP_BUCKET
              Value:
                Ref: BackupBucket
            - Name: BACKUP_KMS_KEY_ARN
              Value:
                Fn::GetAtt: [BackupKey, Arn]
            - Name: ALERT_TOPIC_ARN
              Value:
                Ref: AlertTopic
            - Name: ALERT_RULE_NAMES
              Value: cadenzpoint-backup-protections,cadenzpoint-backup-roles,cadenzpoint-backup-disaster-started,cadenzpoint-backup-disaster-runtask,cadenzpoint-backup-export-started,cadenzpoint-backup-export-runtask
            # feature-plan-cloud-export.md §6.2: protection drift for the exports bucket and its key.
            - Name: EXPORT_BUCKET
              Value:
                Ref: ExportBucket
            - Name: EXPORT_KEY_ARN
              Value:
                Fn::GetAtt: [ExportKey, Arn]
            - Name: TRAIL_NAME
              Value: cadenzpoint-account-trail
            - Name: DLQ_ALARM_NAME
              Value: cadenzpoint-backup-dlq
          Secrets:
            - Name: CONTROL_PLANE_DATABASE_URL
              ValueFrom:
                Fn::Sub: arn:aws:ssm:us-east-1:${AWS::AccountId}:parameter/cadenzpoint/backup/control-plane-url
            - Name: RESTORE_TEST_DATABASE_URL
              ValueFrom:
                Fn::Sub: arn:aws:ssm:us-east-1:${AWS::AccountId}:parameter/cadenzpoint/backup/restore-test-url
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Ref: AuditLogGroup
              awslogs-region: us-east-1
              awslogs-stream-prefix: audit

  # feature-plan-disaster-restore.md §6.2, §6.4: the button's task. Container `disaster` (the button's and the schedule's
  # overrides name it). NEON_HISTORY_RETENTION_SECONDS is deliberately unset: the bundled policy value applies, as in the
  # app's production (impact analysis §6.15).
  DisasterTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: cadenzpoint-backup-disaster
      Cpu: '2048'
      Memory: '4096'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: X86_64
      ExecutionRoleArn:
        Fn::GetAtt: [DisasterExecRole, Arn]
      TaskRoleArn:
        Fn::GetAtt: [DisasterTaskRole, Arn]
      ContainerDefinitions:
        - Name: disaster
          Image:
            Ref: ImageUri
          Essential: true
          Command:
            - disaster
          StopTimeout: 120
          LinuxParameters:
            InitProcessEnabled: true
          Environment:
            - Name: AWS_REGION
              Value: us-east-1
            - Name: BACKUP_BUCKET
              Value:
                Ref: BackupBucket
            - Name: BACKUP_KMS_KEY_ARN
              Value:
                Fn::GetAtt: [BackupKey, Arn]
            - Name: BACKUP_DECRYPT_KEY_ARNS
              Value:
                Fn::GetAtt: [BackupKey, Arn]
            - Name: BACKUP_PG_RESTORE_BIN
              Value: /usr/lib/postgresql/16/bin/pg_restore
            - Name: ALERT_TOPIC_ARN
              Value:
                Ref: AlertTopic
            - Name: BACKUP_LOG_GROUP
              Value: /cadenzpoint/backup/backup
            - Name: NEON_REGION_ID
              Value: aws-us-east-1
            - Name: DISASTER_DEADLINE_MINUTES
              Value: '330'
            # feature-plan-control-plane-disaster.md §6.4 R2: the window's SWITCHING / LINKED / RELINKED lines.
            - Name: DISASTER_LOG_GROUP
              Value: /cadenzpoint/backup/disaster
          Secrets:
            - Name: CONTROL_PLANE_DATABASE_URL
              ValueFrom:
                Fn::Sub: arn:aws:ssm:us-east-1:${AWS::AccountId}:parameter/cadenzpoint/backup/control-plane-url
            - Name: ENCRYPTION_KEY
              ValueFrom:
                Fn::Sub: arn:aws:ssm:us-east-1:${AWS::AccountId}:parameter/cadenzpoint/backup/encryption-key
            - Name: NEON_API_KEY
              ValueFrom:
                Fn::Sub: arn:aws:ssm:us-east-1:${AWS::AccountId}:parameter/cadenzpoint/backup/neon-api-key
            - Name: NEON_ORG_ID
              ValueFrom:
                Fn::Sub: arn:aws:ssm:us-east-1:${AWS::AccountId}:parameter/cadenzpoint/backup/neon-org-id
            - Name: RESTORE_TEST_PROJECT_ID
              ValueFrom:
                Fn::Sub: arn:aws:ssm:us-east-1:${AWS::AccountId}:parameter/cadenzpoint/backup/restore-test-project-id
            - Name: CONTROL_PLANE_PROJECT_ID
              ValueFrom:
                Fn::Sub: arn:aws:ssm:us-east-1:${AWS::AccountId}:parameter/cadenzpoint/backup/control-plane-project-id
            - Name: BACKUP_CONTROL_PLANE_ID
              ValueFrom:
                Fn::Sub: arn:aws:ssm:us-east-1:${AWS::AccountId}:parameter/cadenzpoint/backup/control-plane-backup-id
            # feature-plan-control-plane-disaster.md §6.2 item 2: the control-plane modes' network-first check.
            - Name: RESTORE_TEST_DATABASE_URL
              ValueFrom:
                Fn::Sub: arn:aws:ssm:us-east-1:${AWS::AccountId}:parameter/cadenzpoint/backup/restore-test-url
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Ref: DisasterLogGroup
              awslogs-region: us-east-1
              awslogs-stream-prefix: disaster

  # feature-plan-cloud-export.md §6.3: the Export workspace button's task (deliver, hold, release). 1 vCPU / 4 GB; the ZIP
  # streams (bounded memory). No BACKUP_KMS_KEY_ARN: it never touches the backup bucket or key.
  ExportTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: cadenzpoint-backup-export
      Cpu: '1024'
      Memory: '4096'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: X86_64
      ExecutionRoleArn:
        Fn::GetAtt: [ExportExecRole, Arn]
      TaskRoleArn:
        Fn::GetAtt: [ExportTaskRole, Arn]
      ContainerDefinitions:
        - Name: export
          Image:
            Ref: ImageUri
          Essential: true
          Command:
            - export
          StopTimeout: 120
          LinuxParameters:
            InitProcessEnabled: true
          Environment:
            - Name: AWS_REGION
              Value: us-east-1
            - Name: EXPORT_BUCKET
              Value:
                Ref: ExportBucket
            - Name: ALERT_TOPIC_ARN
              Value:
                Ref: AlertTopic
          Secrets:
            - Name: CONTROL_PLANE_DATABASE_URL
              ValueFrom:
                Fn::Sub: arn:aws:ssm:us-east-1:${AWS::AccountId}:parameter/cadenzpoint/backup/control-plane-url
            - Name: ENCRYPTION_KEY
              ValueFrom:
                Fn::Sub: arn:aws:ssm:us-east-1:${AWS::AccountId}:parameter/cadenzpoint/backup/encryption-key
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Ref: ExportLogGroup
              awslogs-region: us-east-1
              awslogs-stream-prefix: export

  # feature-plan-cloud-export.md §6.7: the hourly sweep, its own family (so it never competes with a press and is never
  # emailed), the same task and execution roles as the export family. 0.25 vCPU / 0.5 GB.
  SweepTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: cadenzpoint-backup-sweep
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: X86_64
      ExecutionRoleArn:
        Fn::GetAtt: [ExportExecRole, Arn]
      TaskRoleArn:
        Fn::GetAtt: [ExportTaskRole, Arn]
      ContainerDefinitions:
        - Name: sweep
          Image:
            Ref: ImageUri
          Essential: true
          Command:
            - export
            - sweep
          StopTimeout: 120
          LinuxParameters:
            InitProcessEnabled: true
          Environment:
            - Name: AWS_REGION
              Value: us-east-1
            - Name: EXPORT_BUCKET
              Value:
                Ref: ExportBucket
          Secrets:
            - Name: CONTROL_PLANE_DATABASE_URL
              ValueFrom:
                Fn::Sub: arn:aws:ssm:us-east-1:${AWS::AccountId}:parameter/cadenzpoint/backup/control-plane-url
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Ref: SweepLogGroup
              awslogs-region: us-east-1
              awslogs-stream-prefix: sweep

  # ---- alerting: immediate email, straight from AWS -----------------------------------------------------------------
  SchedulerDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: cadenzpoint-backup-scheduler-dlq
      MessageRetentionPeriod: 172800
      SqsManagedSseEnabled: true

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: cadenzpoint-backup-alerts

  AlertSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn:
        Ref: AlertTopic
      Protocol: email
      Endpoint:
        Ref: AlertEmail

  AlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - Ref: AlertTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowEventBridgePublish
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource:
              Fn::Sub: arn:aws:sns:us-east-1:${AWS::AccountId}:cadenzpoint-backup-alerts
            Condition:
              StringEquals:
                aws:SourceAccount:
                  Ref: AWS::AccountId
          - Sid: AllowCloudWatchPublish
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource:
              Fn::Sub: arn:aws:sns:us-east-1:${AWS::AccountId}:cadenzpoint-backup-alerts
            Condition:
              StringEquals:
                aws:SourceAccount:
                  Ref: AWS::AccountId

  ProtectionsRule:
    Type: AWS::Events::Rule
    Properties:
      Name: cadenzpoint-backup-protections
      Description: Any change to the backup protections, from any caller, emails the founder at once
      State: ENABLED
      EventPattern:
        detail-type:
          - AWS API Call via CloudTrail
        detail:
          eventName:
            - ScheduleKeyDeletion
            - DisableKey
            - PutKeyPolicy
            - CreateGrant
            - StopLogging
            - DeleteTrail
            - UpdateTrail
            - PutEventSelectors
            - PutBucketPolicy
            - DeleteBucketPolicy
            - PutBucketLifecycle
            - DeleteBucketLifecycle
            - PutBucketVersioning
            - DisableRule
            - DeleteRule
            - PutRule
            - PutTargets
            - RemoveTargets
            - Unsubscribe
            - Subscribe
            - DeleteTopic
            - SetTopicAttributes
            - SetSubscriptionAttributes
            - DeleteAlarms
            - DisableAlarmActions
            - PutMetricAlarm
            - DeleteQueue
            - SetQueueAttributes
            - PutParameter
            - DeleteParameter
            - DeleteParameters
      Targets:
        - Id: alert-topic
          Arn:
            Ref: AlertTopic
          InputTransformer:
            InputPathsMap:
              event: $.detail.eventName
              caller: $.detail.userIdentity.arn
              time: $.time
              bucket: $.detail.requestParameters.bucketName
              key: $.detail.requestParameters.keyId
              name: $.detail.requestParameters.name
              topic: $.detail.requestParameters.topicArn
              queue: $.detail.requestParameters.queueUrl
            InputTemplate: '"CadenzPoint backup protection changed: <event> by <caller> at <time>. Resource: bucket <bucket>, key <key>, rule/trail <name>, topic <topic>, queue <queue>. If you did not make this change, investigate now."'

  RolesRule:
    Type: AWS::Events::Rule
    Properties:
      Name: cadenzpoint-backup-roles
      Description: Any change to a backup role's trust or policies emails the founder at once
      State: ENABLED
      EventPattern:
        detail-type:
          - AWS API Call via CloudTrail
        detail:
          eventName:
            - UpdateAssumeRolePolicy
            - PutRolePolicy
            - DeleteRolePolicy
            - AttachRolePolicy
            - DetachRolePolicy
          requestParameters:
            roleName:
              - prefix: cadenzpoint-backup-
      Targets:
        - Id: alert-topic
          Arn:
            Ref: AlertTopic
          InputTransformer:
            InputPathsMap:
              event: $.detail.eventName
              caller: $.detail.userIdentity.arn
              time: $.time
              role: $.detail.requestParameters.roleName
            InputTemplate: '"CadenzPoint backup role changed: <event> on <role> by <caller> at <time>. If you did not make this change, investigate now."'

  # feature-plan-disaster-restore.md §6.2 (invariant 7): EVERY start and finish of a disaster task is emailed, whatever
  # the caller or path (button, CloudShell, schedule), from ECS's own task-state events (no CloudTrail needed). ECS can send
  # an event more than once, so an occasional duplicate email is expected. `startedBy` is shown when the event carries it.
  DisasterStartedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: cadenzpoint-backup-disaster-started
      Description: Every disaster task start and finish emails the founder
      State: ENABLED
      EventPattern:
        source:
          - aws.ecs
        detail-type:
          - ECS Task State Change
        detail:
          taskDefinitionArn:
            - prefix:
                Fn::Sub: 'arn:aws:ecs:us-east-1:${AWS::AccountId}:task-definition/cadenzpoint-backup-disaster:'
          lastStatus:
            - PENDING
            - PROVISIONING
            - STOPPED
      Targets:
        - Id: alert-topic
          Arn:
            Ref: AlertTopic
          InputTransformer:
            InputPathsMap:
              status: $.detail.lastStatus
              task: $.detail.taskArn
              startedBy: $.detail.startedBy
              stopCode: $.detail.stopCode
              time: $.time
            InputTemplate: '"CadenzPoint disaster task <status> at <time> (started by <startedBy>; task <task>; stop code <stopCode>). If you did not press Disaster restore or run the CloudShell command, and it is not a monthly rehearsal (workspace on the 1st, control plane on the 15th, both 15:17 UTC), investigate now."'

  # The RunTask call itself (CloudTrail), so the email names the caller. Two prefixes in one array already match either
  # form (family or ARN): approved detail D6.
  DisasterRunTaskRule:
    Type: AWS::Events::Rule
    Properties:
      Name: cadenzpoint-backup-disaster-runtask
      Description: Every RunTask of the disaster family emails the founder with the caller
      State: ENABLED
      EventPattern:
        detail-type:
          - AWS API Call via CloudTrail
        detail:
          eventName:
            - RunTask
          requestParameters:
            taskDefinition:
              - prefix: cadenzpoint-backup-disaster
              - prefix:
                  Fn::Sub: arn:aws:ecs:us-east-1:${AWS::AccountId}:task-definition/cadenzpoint-backup-disaster
      Targets:
        - Id: alert-topic
          Arn:
            Ref: AlertTopic
          InputTransformer:
            InputPathsMap:
              caller: $.detail.userIdentity.arn
              time: $.time
              startedBy: $.detail.requestParameters.startedBy
            InputTemplate: '"CadenzPoint disaster task requested by <caller> at <time> (started by <startedBy>). If you did not make this request, investigate now."'

  # feature-plan-cloud-export.md §6.4: every Export workspace press is emailed (start and finish, and the RunTask call with
  # its caller). The export family only: the hourly sweep (cadenzpoint-backup-sweep) is never emailed.
  ExportStartedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: cadenzpoint-backup-export-started
      Description: Every export task start and finish emails the founder
      State: ENABLED
      EventPattern:
        source:
          - aws.ecs
        detail-type:
          - ECS Task State Change
        detail:
          taskDefinitionArn:
            - prefix:
                Fn::Sub: 'arn:aws:ecs:us-east-1:${AWS::AccountId}:task-definition/cadenzpoint-backup-export:'
          lastStatus:
            - PENDING
            - PROVISIONING
            - STOPPED
      Targets:
        - Id: alert-topic
          Arn:
            Ref: AlertTopic
          InputTransformer:
            InputPathsMap:
              status: $.detail.lastStatus
              task: $.detail.taskArn
              startedBy: $.detail.startedBy
              stopCode: $.detail.stopCode
              time: $.time
            InputTemplate: '"CadenzPoint Export workspace task <status> at <time> (started by <startedBy>; task <task>; stop code <stopCode>). If you did not press Export workspace or run the CloudShell command, investigate now."'

  ExportRunTaskRule:
    Type: AWS::Events::Rule
    Properties:
      Name: cadenzpoint-backup-export-runtask
      Description: Every RunTask of the export family emails the founder with the caller
      State: ENABLED
      EventPattern:
        detail-type:
          - AWS API Call via CloudTrail
        detail:
          eventName:
            - RunTask
          requestParameters:
            taskDefinition:
              - prefix: cadenzpoint-backup-export
              - prefix:
                  Fn::Sub: arn:aws:ecs:us-east-1:${AWS::AccountId}:task-definition/cadenzpoint-backup-export
      Targets:
        - Id: alert-topic
          Arn:
            Ref: AlertTopic
          InputTransformer:
            InputPathsMap:
              caller: $.detail.userIdentity.arn
              time: $.time
              startedBy: $.detail.requestParameters.startedBy
            InputTemplate: '"CadenzPoint Export workspace task requested by <caller> at <time> (started by <startedBy>). If you did not make this request, investigate now."'

  DlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: cadenzpoint-backup-dlq
      AlarmDescription: A scheduled backup task could not be started (EventBridge Scheduler dead-letter queue)
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value:
            Fn::GetAtt: [SchedulerDeadLetterQueue, QueueName]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      ActionsEnabled: true
      AlarmActions:
        - Ref: AlertTopic

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: cadenzpoint-backup-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 10
          Unit: USD
        CostTypes:
          IncludeCredit: false
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address:
                Ref: AlertEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address:
                Ref: AlertEmail

  # ---- schedules (UTC; each pins its task definition revision; created last) -------------------------------------
  BackupDailySchedule:
    Type: AWS::Scheduler::Schedule
    DependsOn:
      - BackupKey
      - BackupKeyAlias
      - BackupBucket
      - BackupBucketPolicy
      - Vpc
      - InternetGateway
      - GatewayAttachment
      - PublicRouteTable
      - DefaultRoute
      - SubnetARoutes
      - SubnetBRoutes
      - BackupLogGroup
      - AuditLogGroup
      - RestoreTestLogGroup
      - BackupTaskRole
      - RestoreTestTaskRole
      - AuditTaskRole
      - BackupExecRole
      - AuditExecRole
      - RestoreTestExecRole
      - RestoreTestTaskDefinition
      - AuditTaskDefinition
      - AlertTopic
      - AlertSubscription
      - AlertTopicPolicy
      - ProtectionsRule
      - RolesRule
      - DlqAlarm
      - MonthlyBudget
      - DisasterLogGroup
      - DisasterTaskRole
      - DisasterExecRole
      - DisasterButtonRole
      - DisasterTaskDefinition
      - DisasterStartedRule
      - DisasterRunTaskRule
      - ExportKey
      - ExportKeyAlias
      - ExportBucket
      - ExportBucketPolicy
      - ExportLogGroup
      - SweepLogGroup
      - ExportTaskRole
      - ExportExecRole
      - ExportDownloadRole
      - ExportTaskDefinition
      - SweepTaskDefinition
      - ExportStartedRule
      - ExportRunTaskRule
    Properties:
      Name: cadenzpoint-backup-daily
      ScheduleExpression: 'cron(17 6 * * ? *)'
      ScheduleExpressionTimezone: UTC
      FlexibleTimeWindow:
        Mode: 'OFF'
      State: ENABLED
      Target:
        Arn:
          Fn::GetAtt: [Cluster, Arn]
        RoleArn:
          Fn::GetAtt: [SchedulerRole, Arn]
        RetryPolicy:
          MaximumRetryAttempts: 10
          MaximumEventAgeInSeconds: 3600
        DeadLetterConfig:
          Arn:
            Fn::GetAtt: [SchedulerDeadLetterQueue, Arn]
        EcsParameters:
          TaskDefinitionArn:
            Ref: BackupTaskDefinition
          LaunchType: FARGATE
          PlatformVersion: LATEST
          TaskCount: 1
          NetworkConfiguration:
            AwsvpcConfiguration:
              AssignPublicIp: ENABLED
              Subnets:
                - Ref: SubnetA
                - Ref: SubnetB
              SecurityGroups:
                - Ref: TaskSecurityGroup

  BackupCatchupSchedule:
    Type: AWS::Scheduler::Schedule
    DependsOn:
      - BackupKey
      - BackupKeyAlias
      - BackupBucket
      - BackupBucketPolicy
      - Vpc
      - InternetGateway
      - GatewayAttachment
      - PublicRouteTable
      - DefaultRoute
      - SubnetARoutes
      - SubnetBRoutes
      - BackupLogGroup
      - AuditLogGroup
      - RestoreTestLogGroup
      - BackupTaskRole
      - RestoreTestTaskRole
      - AuditTaskRole
      - BackupExecRole
      - AuditExecRole
      - RestoreTestExecRole
      - RestoreTestTaskDefinition
      - AuditTaskDefinition
      - AlertTopic
      - AlertSubscription
      - AlertTopicPolicy
      - ProtectionsRule
      - RolesRule
      - DlqAlarm
      - MonthlyBudget
      - DisasterLogGroup
      - DisasterTaskRole
      - DisasterExecRole
      - DisasterButtonRole
      - DisasterTaskDefinition
      - DisasterStartedRule
      - DisasterRunTaskRule
      - ExportKey
      - ExportKeyAlias
      - ExportBucket
      - ExportBucketPolicy
      - ExportLogGroup
      - SweepLogGroup
      - ExportTaskRole
      - ExportExecRole
      - ExportDownloadRole
      - ExportTaskDefinition
      - SweepTaskDefinition
      - ExportStartedRule
      - ExportRunTaskRule
    Properties:
      Name: cadenzpoint-backup-catchup
      ScheduleExpression: 'cron(17 18 * * ? *)'
      ScheduleExpressionTimezone: UTC
      FlexibleTimeWindow:
        Mode: 'OFF'
      State: ENABLED
      Target:
        Arn:
          Fn::GetAtt: [Cluster, Arn]
        RoleArn:
          Fn::GetAtt: [SchedulerRole, Arn]
        Input: '{"containerOverrides":[{"name":"backup","command":["backup", "--if-missing-today"]}]}'
        RetryPolicy:
          MaximumRetryAttempts: 10
          MaximumEventAgeInSeconds: 3600
        DeadLetterConfig:
          Arn:
            Fn::GetAtt: [SchedulerDeadLetterQueue, Arn]
        EcsParameters:
          TaskDefinitionArn:
            Ref: BackupTaskDefinition
          LaunchType: FARGATE
          PlatformVersion: LATEST
          TaskCount: 1
          NetworkConfiguration:
