# CadenzPoint backup account: main stack `cadenzpoint-backup` (feature-plan-database-backups.md §6.1), deployed by
# .github/workflows/backup-deploy.yml through scripts/backup/deploy.sh after the founder approves (environment
# aws-backups, Q1), with the bootstrap stack's CfnExecRole. One backup stack per account, so physical names are fixed.
#
# - Long-form intrinsic functions only (U6 parses this file with a plain YAML parser).
# - Role grants are in the roles' own policies; the key and bucket policies only DENY, by `aws:PrincipalArn`, with the
#   ARNs built as strings (no dependency cycle, and no KMS principal-exists check).
# - The protection documents (bucket, key and topic policies, both rules' patterns, every role's trust and policy) must
#   equal scripts/backup/lib/expected-policies.ts, which the daily audit compares with what AWS returns (U6 checks).
# - Schedules depend on every other resource, so a failed first create rolls back before any task can run.
# - The tuning values (concurrency, per-target deadlines, task CPU/memory, the monthly budget) are CONSTANTS here, not
#   parameters: `cloudformation deploy` keeps a parameter's previous value unless it is passed, so a changed default would
#   never reach the live stack. Change the value in this file; the next approved deploy applies it. The only parameters
#   are ImageUri and AlertEmail, and deploy.sh passes both on every deploy (U6 asserts exactly these two).
AWSTemplateFormatVersion: '2010-09-09'
Description: CadenzPoint backups - bucket, KMS key, container tasks, schedules, alerting, budget

Parameters:
  ImageUri:
    Type: String
    Description: The backup image by digest (<repository uri>@sha256:<digest>)
    AllowedPattern: '^[0-9]{12}\.dkr\.ecr\.us-east-1\.amazonaws\.com/cadenzpoint-backup@sha256:[0-9a-f]{64}$'
  AlertEmail:
    Type: String
    NoEcho: true
    Description: The founder's alert email (from the aws-backups environment secret)

Resources:
  # ---- the key and the bucket ------------------------------------------------------------------------------------
  BackupKey:
    Type: AWS::KMS::Key
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Description: CadenzPoint backups (client-side encryption, AWS Encryption SDK)
      KeySpec: SYMMETRIC_DEFAULT
      KeyUsage: ENCRYPT_DECRYPT
      EnableKeyRotation: true
      PendingWindowInDays: 30
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountRootAdministers
            Effect: Allow
            Principal:
              AWS:
                Fn::Sub: arn:aws:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'
          - Sid: DenyDecryptExceptRestoreRoles
            Effect: Deny
            Principal:
              AWS: '*'
            Action:
              - kms:Decrypt
              - kms:ReEncrypt*
            Resource: '*'
            Condition:
              ArnNotEquals:
                aws:PrincipalArn:
                  - Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/cadenzpoint-backup/cadenzpoint-backup-restore-test-task
                  - Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/cadenzpoint-backup/cadenzpoint-backup-disaster-task
          - Sid: DenyShortDeletionWindow
            Effect: Deny
            Principal:
              AWS: '*'
            Action: kms:ScheduleKeyDeletion
            Resource: '*'
            Condition:
              NumericLessThan:
                kms:ScheduleKeyDeletionPendingWindowInDays: '30'
          - Sid: DenyKeyPolicyChangesExceptDeploy
            Effect: Deny
            Principal:
              AWS: '*'
            Action: kms:PutKeyPolicy
            Resource: '*'
            Condition:
              ArnNotEquals:
                aws:PrincipalArn:
                  Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/cadenzpoint-bootstrap/cadenzpoint-backup-cfn

  BackupKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/cadenzpoint-backup
      TargetKeyId:
        Ref: BackupKey

  BackupBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      BucketName:
        Fn::Sub: cadenzpoint-backups-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-v1
            Status: Enabled
            Prefix: v1/
            ExpirationInDays: 25
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  BackupBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: BackupBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - Fn::Sub: arn:aws:s3:::cadenzpoint-backups-${AWS::AccountId}
              - Fn::Sub: arn:aws:s3:::cadenzpoint-backups-${AWS::AccountId}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          - Sid: DenyPutWithoutIfNoneMatch
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource:
              Fn::Sub: arn:aws:s3:::cadenzpoint-backups-${AWS::AccountId}/*
            Condition:
              'Null':
                s3:if-none-match: 'true'
              Bool:
                s3:ObjectCreationOperation: 'true'
          - Sid: DenyVersioningAndObjectLock
            Effect: Deny
            Principal: '*'
            Action:
              - s3:PutBucketVersioning
              - s3:PutBucketObjectLockConfiguration
            Resource:
              Fn::Sub: arn:aws:s3:::cadenzpoint-backups-${AWS::AccountId}
          - Sid: DenyDeletes
            Effect: Deny
            Principal: '*'
            Action: s3:DeleteObject*
            Resource:
              Fn::Sub: arn:aws:s3:::cadenzpoint-backups-${AWS::AccountId}/*
          - Sid: DenyReadsExceptRestoreRoles
            Effect: Deny
            Principal: '*'
            Action: s3:GetObject*
            Resource:
              Fn::Sub: arn:aws:s3:::cadenzpoint-backups-${AWS::AccountId}/*
            Condition:
              ArnNotEquals:
                aws:PrincipalArn:
                  - Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/cadenzpoint-backup/cadenzpoint-backup-restore-test-task
                  - Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/cadenzpoint-backup/cadenzpoint-backup-disaster-task
          - Sid: DenyPolicyAndLifecycleChangesExceptDeploy
            Effect: Deny
            Principal: '*'
            Action:
              - s3:PutBucketPolicy
              - s3:DeleteBucketPolicy
              - s3:PutLifecycleConfiguration
            Resource:
              Fn::Sub: arn:aws:s3:::cadenzpoint-backups-${AWS::AccountId}
            Condition:
              ArnNotEquals:
                aws:PrincipalArn:
                  Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/cadenzpoint-bootstrap/cadenzpoint-backup-cfn

  # ---- the exports bucket and its key (feature-plan-cloud-export.md §6.1) -------------------------------------------
  # Sent export copies (delivery/, 7-day links) and legal-hold copies (hold/, kept until released). SSE-KMS with the bucket
  # key; only the export task role writes, reads hold/ or deletes; the Vercel download role reads delivery/ through
  # 5-minute presigned URLs. Legal holds depend on this key: the same deletion-window and policy-change denies as the
  # backup key, and 3b's KMS alerts (matched by event name) cover it.
  ExportKey:
    Type: AWS::KMS::Key
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Description: CadenzPoint exports bucket (SSE-KMS with the bucket key; legal holds depend on it)
      KeySpec: SYMMETRIC_DEFAULT
      KeyUsage: ENCRYPT_DECRYPT
      EnableKeyRotation: true
      PendingWindowInDays: 30
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountRootAdministers
            Effect: Allow
            Principal:
              AWS:
                Fn::Sub: arn:aws:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'
          - Sid: DenyDecryptExceptExportRoles
            Effect: Deny
            Principal:
              AWS: '*'
            Action:
              - kms:Decrypt
              - kms:ReEncrypt*
            Resource: '*'
            Condition:
              ArnNotEquals:
                aws:PrincipalArn:
                  - Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/cadenzpoint-backup/cadenzpoint-backup-export-task
                  - Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/cadenzpoint-backup/cadenzpoint-backup-export-download
          - Sid: DenyGenerateDataKeyExceptExportTask
            Effect: Deny
            Principal:
              AWS: '*'
            Action: kms:GenerateDataKey*
            Resource: '*'
            Condition:
              ArnNotEquals:
                aws:PrincipalArn:
                  Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/cadenzpoint-backup/cadenzpoint-backup-export-task
          - Sid: DenyShortDeletionWindow
            Effect: Deny
            Principal:
              AWS: '*'
            Action: kms:ScheduleKeyDeletion
            Resource: '*'
            Condition:
              NumericLessThan:
                kms:ScheduleKeyDeletionPendingWindowInDays: '30'
          - Sid: DenyKeyPolicyChangesExceptDeploy
            Effect: Deny
            Principal:
              AWS: '*'
            Action: kms:PutKeyPolicy
            Resource: '*'
            Condition:
              ArnNotEquals:
                aws:PrincipalArn:
                  Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/cadenzpoint-bootstrap/cadenzpoint-backup-cfn

  ExportKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/cadenzpoint-exports
      TargetKeyId:
        Ref: ExportKey

  ExportBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      BucketName:
        Fn::Sub: cadenzpoint-exports-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID:
                Fn::GetAtt: [ExportKey, Arn]
            BucketKeyEnabled: true
      # expire-delivery is the backstop (the hourly sweep erases a copy within the hour after its link expires): lifecycle
      # counts from the upload and rounds to midnight UTC, so 7 days could remove a file before its link expires. No rule
      # for hold/ (kept until the founder releases it).
      LifecycleConfiguration:
        Rules:
          - Id: expire-delivery
            Status: Enabled
            Prefix: delivery/
            ExpirationInDays: 8
          - Id: abort-mpu
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  ExportBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: ExportBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - Fn::Sub: arn:aws:s3:::cadenzpoint-exports-${AWS::AccountId}
              - Fn::Sub: arn:aws:s3:::cadenzpoint-exports-${AWS::AccountId}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          - Sid: DenyVersioningAndObjectLock
            Effect: Deny
            Principal: '*'
            Action:
              - s3:PutBucketVersioning
              - s3:PutBucketObjectLockConfiguration
            Resource:
              Fn::Sub: arn:aws:s3:::cadenzpoint-exports-${AWS::AccountId}
          - Sid: DenyWritesExceptExportTask
            Effect: Deny
            Principal: '*'
            Action:
              - s3:PutObject*
              - s3:DeleteObject*
              - s3:AbortMultipartUpload
            Resource:
              Fn::Sub: arn:aws:s3:::cadenzpoint-exports-${AWS::AccountId}/*
            Condition:
              ArnNotEquals:
                aws:PrincipalArn:
                  Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/cadenzpoint-backup/cadenzpoint-backup-export-task
          - Sid: DenyReadsExceptExportRoles
            Effect: Deny
            Principal: '*'
            Action: s3:GetObject*
            Resource:
              Fn::Sub: arn:aws:s3:::cadenzpoint-exports-${AWS::AccountId}/*
            Condition:
              ArnNotEquals:
                aws:PrincipalArn:
                  - Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/cadenzpoint-backup/cadenzpoint-backup-export-task
                  - Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/cadenzpoint-backup/cadenzpoint-backup-export-download
          - Sid: DenyHoldReadsExceptExportTask
            Effect: Deny
            Principal: '*'
            Action: s3:GetObject*
            Resource:
              Fn::Sub: arn:aws:s3:::cadenzpoint-exports-${AWS::AccountId}/hold/*
            Condition:
              ArnNotEquals:
                aws:PrincipalArn:
                  Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/cadenzpoint-backup/cadenzpoint-backup-export-task
          - Sid: DenyPolicyAndLifecycleChangesExceptDeploy
            Effect: Deny
            Principal: '*'
            Action:
              - s3:PutBucketPolicy
              - s3:DeleteBucketPolicy
              - s3:PutLifecycleConfiguration
              - s3:PutEncryptionConfiguration
            Resource:
              Fn::Sub: arn:aws:s3:::cadenzpoint-exports-${AWS::AccountId}
            Condition:
              ArnNotEquals:
                aws:PrincipalArn:
                  Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/cadenzpoint-bootstrap/cadenzpoint-backup-cfn

  # ---- network: public subnets, no NAT gateway ---------------------------------------------------------------------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId:
        Ref: Vpc
      InternetGatewayId:
        Ref: InternetGateway

  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: Vpc
      CidrBlock: 10.42.0.0/24
      AvailabilityZone:
        Fn::Select:
          - 0
          - Fn::GetAZs: ''

  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: Vpc
      CidrBlock: 10.42.1.0/24
      AvailabilityZone:
        Fn::Select:
          - 1
          - Fn::GetAZs: ''

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId:
        Ref: Vpc

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId:
        Ref: PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId:
        Ref: InternetGateway

  SubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId:
        Ref: SubnetA
      RouteTableId:
        Ref: PublicRouteTable

  SubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId:
        Ref: SubnetB
      RouteTableId:
        Ref: PublicRouteTable

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CadenzPoint backup tasks - egress to HTTPS and Postgres only, no ingress
      VpcId:
        Ref: Vpc
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: AWS APIs and ECR
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 0.0.0.0/0
          Description: Neon Postgres

  # ---- containers --------------------------------------------------------------------------------------------------
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: cadenzpoint-backup
      CapacityProviders:
        - FARGATE
      ClusterSettings:
        - Name: containerInsights
          Value: disabled

  BackupLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /cadenzpoint/backup/backup
      RetentionInDays: 30

  AuditLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /cadenzpoint/backup/audit
      RetentionInDays: 30

  RestoreTestLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /cadenzpoint/backup/restore-test
      RetentionInDays: 30

  # feature-plan-disaster-restore.md §6.2: ids only (invariant 6), kept a year.
  DisasterLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /cadenzpoint/backup/disaster
      RetentionInDays: 365

  # feature-plan-cloud-export.md §6.3, §6.7: the export task's log (ids only), kept a year; the hourly sweep's, 30 days.
  ExportLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /cadenzpoint/backup/export
      RetentionInDays: 365

  SweepLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /cadenzpoint/backup/sweep
      RetentionInDays: 30

  # ---- roles (path /cadenzpoint-backup/; every name starts cadenzpoint-backup-) -------------------------------------
  BackupTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cadenzpoint-backup-backup-task
      Path: /cadenzpoint-backup/
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: TrustEcsTasks
            Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount:
                  Ref: AWS::AccountId
              ArnLike:
                aws:SourceArn:
                  Fn::Sub: arn:aws:ecs:us-east-1:${AWS::AccountId}:*
      Policies:
        - PolicyName: cadenzpoint-backup-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: PutBackups
                Effect: Allow
                Action: s3:PutObject
                Resource:
                  Fn::Sub: arn:aws:s3:::cadenzpoint-backups-${AWS::AccountId}/v1/*
              - Sid: AbortUploads
                Effect: Allow
                Action: s3:AbortMultipartUpload
                Resource:
                  Fn::Sub: arn:aws:s3:::cadenzpoint-backups-${AWS::AccountId}/v1/*
              - Sid: GenerateDataKeys
                Effect: Allow
                Action: kms:GenerateDataKey
                Resource:
                  Fn::GetAtt: [BackupKey, Arn]
                Condition:
                  StringEquals:
                    kms:EncryptionContext:purpose: cadenzpoint-backup

  RestoreTestTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cadenzpoint-backup-restore-test-task
      Path: /cadenzpoint-backup/
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: TrustEcsTasks
            Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount:
                  Ref: AWS::AccountId
              ArnLike:
                aws:SourceArn:
                  Fn::Sub: arn:aws:ecs:us-east-1:${AWS::AccountId}:*
      Policies:
        - PolicyName: cadenzpoint-backup-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadBackups
                Effect: Allow
                Action: s3:GetObject
                Resource:
                  Fn::Sub: arn:aws:s3:::cadenzpoint-backups-${AWS::AccountId}/v1/*
              - Sid: ListBackups
                Effect: Allow
                Action: s3:ListBucket
                Resource:
                  Fn::Sub: arn:aws:s3:::cadenzpoint-backups-${AWS::AccountId}
                Condition:
                  StringLike:
                    s3:prefix: v1/*
              - Sid: DecryptBackups
                Effect: Allow
                Action: kms:Decrypt
                Resource:
                  Fn::GetAtt: [BackupKey, Arn]
                Condition:
                  StringEquals:
                    kms:EncryptionContext:purpose: cadenzpoint-backup

  AuditTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cadenzpoint-backup-audit-task
      Path: /cadenzpoint-backup/
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: TrustEcsTasks
            Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount:
                  Ref: AWS::AccountId
              ArnLike:
                aws:SourceArn:
                  Fn::Sub: arn:aws:ecs:us-east-1:${AWS::AccountId}:*
      Policies:
        - PolicyName: cadenzpoint-backup-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ListBackups
                Effect: Allow
                Action: s3:ListBucket
                Resource:
                  Fn::Sub: arn:aws:s3:::cadenzpoint-backups-${AWS::AccountId}
                Condition:
                  StringLike:
                    s3:prefix: v1/*
              - Sid: InspectBucket
                Effect: Allow
                Action:
                  - s3:GetBucketPolicy
                  - s3:GetBucketVersioning
                  - s3:GetLifecycleConfiguration
                  - s3:ListBucketMultipartUploads
                Resource:
                  Fn::Sub: arn:aws:s3:::cadenzpoint-backups-${AWS::AccountId}
              - Sid: InspectKey
                Effect: Allow
                Action:
                  - kms:DescribeKey
                  - kms:GetKeyPolicy
                Resource:
                  Fn::GetAtt: [BackupKey, Arn]
              - Sid: InspectRules
                Effect: Allow
                Action:
                  - events:DescribeRule
                  - events:ListTargetsByRule
                Resource:
                  - Fn::Sub: arn:aws:events:us-east-1:${AWS::AccountId}:rule/cadenzpoint-backup-protections
                  - Fn::Sub: arn:aws:events:us-east-1:${AWS::AccountId}:rule/cadenzpoint-backup-roles
                  - Fn::Sub: arn:aws:events:us-east-1:${AWS::AccountId}:rule/cadenzpoint-backup-disaster-started
                  - Fn::Sub: arn:aws:events:us-east-1:${AWS::AccountId}:rule/cadenzpoint-backup-disaster-runtask
                  - Fn::Sub: arn:aws:events:us-east-1:${AWS::AccountId}:rule/cadenzpoint-backup-export-started
                  - Fn::Sub: arn:aws:events:us-east-1:${AWS::AccountId}:rule/cadenzpoint-backup-export-runtask
              # feature-plan-cloud-export.md §6.2: the exports bucket (its encryption is checked; the backup bucket's isn't:
              # its data is client-side encrypted) and its key.
              - Sid: InspectExportBucket
                Effect: Allow
                Action:
                  - s3:GetBucketPolicy
                  - s3:GetLifecycleConfiguration
                  - s3:GetEncryptionConfiguration
                Resource:
                  Fn::Sub: arn:aws:s3:::cadenzpoint-exports-${AWS::AccountId}
              - Sid: InspectExportKey
                Effect: Allow
                Action:
                  - kms:DescribeKey
                  - kms:GetKeyPolicy
                Resource:
                  Fn::GetAtt: [ExportKey, Arn]
              - Sid: InspectTopic
                Effect: Allow
                Action:
                  - sns:GetTopicAttributes
                  - sns:ListSubscriptionsByTopic
                Resource:
                  Fn::Sub: arn:aws:sns:us-east-1:${AWS::AccountId}:cadenzpoint-backup-alerts
              - Sid: InspectSubscriptions
                Effect: Allow
                Action: sns:GetSubscriptionAttributes
                Resource:
                  Fn::Sub: arn:aws:sns:us-east-1:${AWS::AccountId}:cadenzpoint-backup-alerts:*
              - Sid: InspectTrail
                Effect: Allow
                Action: cloudtrail:GetTrailStatus
                Resource:
                  Fn::Sub: arn:aws:cloudtrail:us-east-1:${AWS::AccountId}:trail/cadenzpoint-account-trail
              - Sid: InspectAlarm
                Effect: Allow
                Action: cloudwatch:DescribeAlarms
                Resource:
                  Fn::Sub: arn:aws:cloudwatch:us-east-1:${AWS::AccountId}:alarm:cadenzpoint-backup-dlq
              - Sid: InspectRoles
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:ListRolePolicies
                Resource:
                  Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/cadenzpoint-backup/*

  # feature-plan-disaster-restore.md §6.2: the disaster task reads backups (like the restore test), the backup task's
  # BACKUP lines, its own family's running tasks, and emails the founder. No SSM write, no S3 write.
  DisasterTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cadenzpoint-backup-disaster-task
      Path: /cadenzpoint-backup/
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: TrustEcsTasks
            Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount:
                  Ref: AWS::AccountId
              ArnLike:
                aws:SourceArn:
                  Fn::Sub: arn:aws:ecs:us-east-1:${AWS::AccountId}:*
      Policies:
        - PolicyName: cadenzpoint-backup-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadBackups
                Effect: Allow
                Action: s3:GetObject
                Resource:
                  Fn::Sub: arn:aws:s3:::cadenzpoint-backups-${AWS::AccountId}/v1/*
              - Sid: ListBackups
