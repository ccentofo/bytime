Outputs:
  BackupBucket:
    Value:
      Ref: BackupBucket
  BackupKeyArn:
    Value:
      Fn::GetAtt: [BackupKey, Arn]
  ClusterName:
    Value:
      Ref: Cluster
  # feature-plan-disaster-restore.md §6.1: the button reads these (cloudformation:DescribeStacks); the role's ARN goes into
  # the aws-disaster environment secret AWS_DISASTER_ROLE_ARN.
  DisasterButtonRoleArn:
    Value:
      Fn::GetAtt: [DisasterButtonRole, Arn]
  TaskSubnets:
    Value:
      Fn::Join:
        - ','
        - - Ref: SubnetA
          - Ref: SubnetB
  TaskSecurityGroup:
    Value:
      Ref: TaskSecurityGroup
  # feature-plan-control-plane-disaster.md §6.1: the modes this stack's image runs. The button refuses a mode (or the
  # control-plane rehearsal) not listed here, before any AWS start; a stack without this output allows 3c's modes only.
  DisasterModes:
    Value: workspace rehearse control-plane reconcile rehearse-control-plane
  # feature-plan-cloud-export.md §6.4: the modes this stack's image runs (the Export workspace button refuses others), and
  # the two values the founder copies into Vercel's production env (EXPORT_DOWNLOAD_ROLE_ARN, EXPORT_BUCKET; 13d).
  ExportModes:
    Value: deliver hold release
  ExportDownloadRoleArn:
    Value:
      Fn::GetAtt: [ExportDownloadRole, Arn]
  ExportBucket:
    Value:
      Ref: ExportBucket
  ExportKeyArn:
    Value:
      Fn::GetAtt: [ExportKey, Arn]
