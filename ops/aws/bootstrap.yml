# CadenzPoint backup account: bootstrap stack `cadenzpoint-backup-bootstrap` (feature-plan-database-backups.md §6.1).
# The founder creates it ONCE in the AWS console (us-east-1): CloudFormation → Create stack → upload this file →
# acknowledge IAM → Submit. Updates are also done in the console, with the lead. It is not in the deploy workflow's
# path list, and no deploy can touch it: its roles live under /cadenzpoint-bootstrap/, outside what CfnExecRole manages.
# Long-form intrinsic functions only (U6 parses this with a plain YAML parser).
AWSTemplateFormatVersion: '2010-09-09'
Description: CadenzPoint backups - bootstrap (GitHub OIDC, deploy roles, image registry, artifacts bucket, account trail)

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cadenzpoint-backup-deploy
      Path: /cadenzpoint-bootstrap/
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: TrustGitHubEnvironment
            Effect: Allow
            Principal:
              Federated:
                Fn::GetAtt: [GitHubOidcProvider, Arn]
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: repo:ccentofo/bytime:environment:aws-backups
      Policies:
        - PolicyName: cadenzpoint-backup-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: RegistryLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: PushImages
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource:
                  Fn::GetAtt: [Repository, Arn]
              - Sid: TemplateArtifacts
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  Fn::Sub: ${ArtifactsBucket.Arn}/*
              - Sid: ValidateTemplates
                Effect: Allow
                Action:
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ValidateTemplate
                Resource: '*'
              - Sid: DeployTheBackupStackOnly
                Effect: Allow
                Action:
                  - cloudformation:ContinueUpdateRollback
                  - cloudformation:CreateChangeSet
                  - cloudformation:CreateStack
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStacks
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:UpdateStack
                Resource:
                  - Fn::Sub: arn:aws:cloudformation:us-east-1:${AWS::AccountId}:stack/cadenzpoint-backup/*
                  - Fn::Sub: arn:aws:cloudformation:us-east-1:${AWS::AccountId}:changeSet/awscli-cloudformation-package-deploy-*/*
              - Sid: PassTheDeployRole
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  Fn::GetAtt: [CfnExecRole, Arn]
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com

  CfnExecRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cadenzpoint-backup-cfn
      Path: /cadenzpoint-bootstrap/
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: TrustCloudFormation
            Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: cadenzpoint-backup-cfn
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: BackupBucket
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:DeleteBucketPolicy
                  - s3:GetBucketLocation
                  - s3:GetBucketOwnershipControls
                  - s3:GetBucketPolicy
                  - s3:GetBucketPublicAccessBlock
                  - s3:GetBucketTagging
                  - s3:GetBucketVersioning
                  - s3:GetEncryptionConfiguration
                  - s3:GetLifecycleConfiguration
                  - s3:ListBucket
                  - s3:PutBucketOwnershipControls
                  - s3:PutBucketPolicy
                  - s3:PutBucketPublicAccessBlock
                  - s3:PutBucketTagging
                  - s3:PutEncryptionConfiguration
                  - s3:PutLifecycleConfiguration
                Resource:
                  Fn::Sub: arn:aws:s3:::cadenzpoint-backups-${AWS::AccountId}
              - Sid: CreateKeys
                Effect: Allow
                Action:
                  - kms:CreateKey
                  - kms:ListAliases
                Resource: '*'
              - Sid: ManageTheBackupKey
                Effect: Allow
                Action:
                  - kms:CreateAlias
                  - kms:DeleteAlias
                  - kms:DescribeKey
                  - kms:EnableKeyRotation
                  - kms:GetKeyPolicy
                  - kms:GetKeyRotationStatus
                  - kms:ListResourceTags
                  - kms:PutKeyPolicy
                  - kms:ScheduleKeyDeletion
                  - kms:TagResource
                  - kms:UntagResource
                  - kms:UpdateAlias
                  - kms:UpdateKeyDescription
                Resource:
                  - Fn::Sub: arn:aws:kms:us-east-1:${AWS::AccountId}:key/*
                  - Fn::Sub: arn:aws:kms:us-east-1:${AWS::AccountId}:alias/cadenzpoint-backup
              - Sid: Network
                Effect: Allow
                Action:
                  - ec2:AssociateRouteTable
                  - ec2:AttachInternetGateway
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:CreateInternetGateway
                  - ec2:CreateRoute
                  - ec2:CreateRouteTable
                  - ec2:CreateSecurityGroup
                  - ec2:CreateSubnet
                  - ec2:CreateTags
                  - ec2:CreateVpc
                  - ec2:DeleteInternetGateway
                  - ec2:DeleteRoute
                  - ec2:DeleteRouteTable
                  - ec2:DeleteSecurityGroup
                  - ec2:DeleteSubnet
                  - ec2:DeleteTags
                  - ec2:DeleteVpc
                  - ec2:Describe*
                  - ec2:DetachInternetGateway
                  - ec2:DisassociateRouteTable
                  - ec2:ModifySubnetAttribute
                  - ec2:ModifyVpcAttribute
                  - ec2:ReplaceRoute
                  - ec2:RevokeSecurityGroupEgress
                  - ec2:RevokeSecurityGroupIngress
                Resource: '*'
              - Sid: ContainerTasks
                Effect: Allow
                Action:
                  - ecs:CreateCluster
                  - ecs:DeleteCluster
                  - ecs:DeregisterTaskDefinition
                  - ecs:DescribeClusters
                  - ecs:DescribeTaskDefinition
                  - ecs:ListTagsForResource
                  - ecs:PutClusterCapacityProviders
                  - ecs:RegisterTaskDefinition
                  - ecs:TagResource
                  - ecs:UntagResource
                  - ecs:UpdateCluster
                  - ecs:UpdateClusterSettings
                Resource: '*'
              - Sid: EcsServiceLinkedRole
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: arn:aws:iam::*:role/aws-service-role/ecs.amazonaws.com/*
                Condition:
                  StringEquals:
                    iam:AWSServiceName: ecs.amazonaws.com
              - Sid: LogGroups
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:DeleteRetentionPolicy
                  - logs:ListTagsForResource
                  - logs:PutRetentionPolicy
                  - logs:TagResource
                  - logs:UntagResource
                Resource:
                  Fn::Sub: arn:aws:logs:us-east-1:${AWS::AccountId}:log-group:/cadenzpoint/backup/*
              - Sid: DescribeLogGroups
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: '*'
              - Sid: BackupRolesOnly
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:DeleteRolePolicy
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:ListRolePolicies
                  - iam:ListRoleTags
                  - iam:PutRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:UpdateRole
                Resource:
                  Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/cadenzpoint-backup/*
              - Sid: PassBackupRoles
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/cadenzpoint-backup/*
                Condition:
                  StringEquals:
                    iam:PassedToService:
                      - ecs-tasks.amazonaws.com
                      - scheduler.amazonaws.com
              - Sid: Schedules
                Effect: Allow
                Action:
                  - scheduler:CreateSchedule
                  - scheduler:DeleteSchedule
                  - scheduler:GetSchedule
                  - scheduler:UpdateSchedule
                Resource:
                  Fn::Sub: arn:aws:scheduler:us-east-1:${AWS::AccountId}:schedule/default/cadenzpoint-backup-*
              - Sid: DeadLetterQueue
                Effect: Allow
                Action:
                  - sqs:CreateQueue
                  - sqs:DeleteQueue
                  - sqs:GetQueueAttributes
                  - sqs:ListQueueTags
                  - sqs:SetQueueAttributes
                  - sqs:TagQueue
                  - sqs:UntagQueue
                Resource:
                  Fn::Sub: arn:aws:sqs:us-east-1:${AWS::AccountId}:cadenzpoint-backup-scheduler-dlq
              - Sid: AlertTopic
                Effect: Allow
                Action:
                  - sns:CreateTopic
                  - sns:DeleteTopic
                  - sns:GetSubscriptionAttributes
                  - sns:GetTopicAttributes
                  - sns:ListSubscriptionsByTopic
                  - sns:ListTagsForResource
                  - sns:SetTopicAttributes
                  - sns:Subscribe
                  - sns:TagResource
                  - sns:Unsubscribe
                  - sns:UntagResource
                Resource:
                  - Fn::Sub: arn:aws:sns:us-east-1:${AWS::AccountId}:cadenzpoint-backup-alerts
                  - Fn::Sub: arn:aws:sns:us-east-1:${AWS::AccountId}:cadenzpoint-backup-alerts:*
              - Sid: AlertRules
                Effect: Allow
                Action:
                  - events:DeleteRule
                  - events:DescribeRule
                  - events:DisableRule
                  - events:EnableRule
                  - events:ListTagsForResource
                  - events:ListTargetsByRule
                  - events:PutRule
                  - events:PutTargets
                  - events:RemoveTargets
                  - events:TagResource
                  - events:UntagResource
                Resource:
                  Fn::Sub: arn:aws:events:us-east-1:${AWS::AccountId}:rule/cadenzpoint-backup-*
              - Sid: DlqAlarm
                Effect: Allow
                Action:
                  - cloudwatch:DeleteAlarms
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:ListTagsForResource
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:TagResource
                  - cloudwatch:UntagResource
                Resource:
                  Fn::Sub: arn:aws:cloudwatch:us-east-1:${AWS::AccountId}:alarm:cadenzpoint-backup-dlq
              - Sid: Budget
                Effect: Allow
                Action:
                  - budgets:ModifyBudget
                  - budgets:ViewBudget
                Resource:
                  Fn::Sub: arn:aws:budgets::${AWS::AccountId}:budget/cadenzpoint-backup-monthly

  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: cadenzpoint-backup
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"keep the last 20 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":20},"action":{"type":"expire"}}]}'

  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-artifacts
            Status: Enabled
            ExpirationInDays: 30

  ArtifactsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: ArtifactsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - Fn::GetAtt: [ArtifactsBucket, Arn]
              - Fn::Sub: ${ArtifactsBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  TrailBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-trail-logs
            Status: Enabled
            ExpirationInDays: 365

  TrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: TrailBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - Fn::GetAtt: [TrailBucket, Arn]
              - Fn::Sub: ${TrailBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          - Sid: CloudTrailAclCheck
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource:
              Fn::GetAtt: [TrailBucket, Arn]
            Condition:
              StringEquals:
                aws:SourceArn:
                  Fn::Sub: arn:aws:cloudtrail:us-east-1:${AWS::AccountId}:trail/cadenzpoint-account-trail
          - Sid: CloudTrailWrite
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource:
              Fn::Sub: ${TrailBucket.Arn}/AWSLogs/${AWS::AccountId}/*
            Condition:
              StringEquals:
                aws:SourceArn:
                  Fn::Sub: arn:aws:cloudtrail:us-east-1:${AWS::AccountId}:trail/cadenzpoint-account-trail

  AccountTrail:
    Type: AWS::CloudTrail::Trail
    DependsOn: TrailBucketPolicy
    Properties:
      TrailName: cadenzpoint-account-trail
      S3BucketName:
        Ref: TrailBucket
      IsLogging: true
      IsMultiRegionTrail: true
      IncludeGlobalServiceEvents: true
      EnableLogFileValidation: true
      EventSelectors:
        - ReadWriteType: All
          IncludeManagementEvents: true

Outputs:
  DeployRoleArn:
    Value:
      Fn::GetAtt: [DeployRole, Arn]
  CfnExecRoleArn:
    Value:
      Fn::GetAtt: [CfnExecRole, Arn]
  RepositoryUri:
    Value:
      Fn::GetAtt: [Repository, RepositoryUri]
  ArtifactsBucket:
    Value:
      Ref: ArtifactsBucket
