name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy-prod" to confirm'
        required: true
        default: ''
      # feature-plan-disaster-restore.md §6.0: skip workspaces the disaster button proved lost (RESTORE.md runbook A).
      skip_lost_workspaces:
        description: 'Skip workspaces proven lost by the Disaster restore button (only during a disaster)'
        type: boolean
        default: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'deploy-prod'
    # Secrets (CONTROL_PLANE_DATABASE_URL, ENCRYPTION_KEY, …) come from the GitHub "production"
    # Environment — NOT repo-level secrets — so they're isolated from staging. Add a required
    # reviewer on this Environment to gate production deploys behind a manual approval.
    environment: production
    steps:
      # Pinned by SHA (BLUEPRINT-STANDARD.md §2; feature-plan-disaster-restore.md §6.0).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      - name: Migrate control plane + all tenants
        run: |
          if [ "$SKIP_LOST" = true ]; then npm run db:migrate:all -- --skip-lost; else npm run db:migrate:all; fi
        env:
          SKIP_LOST: ${{ inputs.skip_lost_workspaces == true }}
          CONTROL_PLANE_DATABASE_URL: ${{ secrets.CONTROL_PLANE_DATABASE_URL }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          # Confirms a `deleting` tenant's Neon project is gone (skip, not FAIL) — launch-blockers audit A11.
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      - name: Verify every database is current
        run: |
          if [ "$SKIP_LOST" = true ]; then npm run db:migrate:check -- --skip-lost; else npm run db:migrate:check; fi
        env:
          SKIP_LOST: ${{ inputs.skip_lost_workspaces == true }}
          CONTROL_PLANE_DATABASE_URL: ${{ secrets.CONTROL_PLANE_DATABASE_URL }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          # Confirms a `deleting` tenant's Neon project is gone (skip, not FAIL) — launch-blockers audit A11.
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      - name: Install Vercel CLI
        # Exact version; npm ignores the project .npmrc in global mode, so the retries are explicit.
        run: npm i -g vercel@65.17.0 --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000
      - name: Deploy to Vercel (production)
        run: |
          vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
          vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
          vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
