# The Export workspace button (feature-plan-cloud-export.md §6.4; TENANT-DELETION.md "Final export"). The founder never
# downloads customer data: a press starts one export task in the backup AWS account, which builds the workspace's export
# ZIP into the exports bucket and records a 7-day delivery (deliver), a legal-hold copy (hold), or releases a hold.
# Founder-only: the job runs in the `aws-disaster` environment (required reviewer: the founder; main only), and only that
# environment's OIDC token can assume the button role, which may start only the disaster and export task families.
#
# The repository is public: run logs are readable by anyone logged in. So the inputs are NEVER put in `env:` or a step's
# `${{ }}`; export-button.sh reads them from the event file and masks the target, both address inputs and the reason before
# it prints anything. To cancel a press, cancel the run: its last step stops the task.
name: Export workspace

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'deliver (email a 7-day link to the notice recipients), hold (keep a legal-hold copy) or release (delete a hold)'
        type: choice
        options: [deliver, hold, release]
        required: true
      target:
        description: 'The workspace id (uuid) for deliver and hold; the hold id for release'
        type: string
        required: true
      extra_recipient:
        description: 'deliver only: one verified address for a legal or policy case (required for a policy-hold workspace)'
        type: string
        required: false
      extra_recipient_again:
        description: 'The same address again (must match exactly)'
        type: string
        required: false
      reason:
        description: 'Required for hold, release, and deliver with an extra address (at most 200 characters; record your out-of-band check)'
        type: string
        required: false
      confirm:
        description: 'Type the mode again'
        type: string
        required: true

permissions: { contents: read }

concurrency: { group: export-workspace, cancel-in-progress: false, queue: max }   # a second press waits; never dropped

jobs:
  run:
    if: github.ref == 'refs/heads/main' && vars.AWS_BACKUPS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: aws-disaster
    timeout-minutes: 75
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with: { role-to-assume: '${{ secrets.AWS_DISASTER_ROLE_ARN }}', aws-region: us-east-1, role-duration-seconds: 5400, mask-aws-account-id: true }
      - id: run
        run: exec bash scripts/backup/export-button.sh
      - if: cancelled()
        run: bash scripts/backup/export-button.sh --stop
