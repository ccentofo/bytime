name: Deploy to Staging

on:
  workflow_dispatch:  # Manual trigger only
    inputs:
      confirm:
        description: 'Type "deploy" to confirm'
        required: true
        default: ''

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'deploy'
    # Secrets (CONTROL_PLANE_DATABASE_URL, ENCRYPTION_KEY, …) come from the GitHub "staging"
    # Environment — NOT repo-level secrets — so a staging deploy can never migrate production DBs.
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}

      - name: Migrate control plane + all tenants
        run: npm run db:migrate:all
        env:
          CONTROL_PLANE_DATABASE_URL: ${{ secrets.CONTROL_PLANE_DATABASE_URL }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}

      - name: Verify every database is current
        run: npm run db:migrate:check
        env:
          CONTROL_PLANE_DATABASE_URL: ${{ secrets.CONTROL_PLANE_DATABASE_URL }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      # Staging is its OWN Vercel project (VERCEL_PROJECT_ID comes from the "staging" GitHub
      # Environment), deployed as that project's production deployment. A preview deployment
      # would get a random *.vercel.app URL, which can't serve tenant subdomains — the
      # staging domains (staging.cadenzpoint.com + *.staging.cadenzpoint.com) attach only to
      # the project's production deployment.
      - name: Deploy to Vercel (staging project)
        run: |
          vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
          vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
          vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
